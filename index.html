<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>조선 인생극장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@800&family=Gowun+Batang:wght@400;700&family=East+Sea+Dokdo&family=DotGothic16&family=Jua&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* 레이아웃: 왼쪽에 타일맵과 대화창, 오른쪽에 상태창. 좁은 화면에서는 한 줄로 쌓인다. 단일 테마(밝은 한지 바탕 + 쯔꾸르식 파란 창)로 의도적으로 고정 */
:root{
  --paper:#fbf6ec; --dot:#e7dfcf; --ink:#1f2a44; --sub:#5b6478; --accent:#ff6b4a; --teal:#2bb3a3; --gold:#f2b632;
  --card:#fffdf8; --soft:#fff1e6; --soft2:#e6f6f3;
  --win-a:#2c4fb8; --win-b:#0e2060; --win-line:#f4f1e6; --win-ink:#ffffff; --win-dim:#b9c6f2;
  --c-lr:#6c95ff; --c-wl:#f2b632; --c-hn:#b98cff; --c-hp:#ff7a5c; --c-bd:#ff6fae;
  --shadow:0 2px 0 rgba(31,42,68,.08),0 8px 24px rgba(31,42,68,.08);
  --f-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-b:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.55;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.jua{font-family:var(--f-d);font-weight:400;letter-spacing:-.2px;text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seal{width:46px;height:46px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-d);font-size:26px;box-shadow:var(--shadow);transform:rotate(-4deg);border:2px solid var(--ink)}
.top h1{margin:0;font-size:30px;line-height:1.1}
.top small{display:block;color:var(--sub);font-size:13px}
.top .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:9px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.tea{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:#d9d0bd}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}

/* 맵 */
.stage{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#7cc368;line-height:0}
#map{display:block;width:100%;height:auto;aspect-ratio:10/7;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;transform:translate(-50%,-100%);background:rgba(31,42,68,.86);color:#fff;border:2px solid var(--win-line);border-radius:6px;padding:0 6px;font:400 clamp(10px,1.7vw,14px)/1.5 var(--f-d);white-space:nowrap;pointer-events:none}
.sign.on{background:var(--accent);border-color:#fff}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;padding:4px 16px;border:3px solid var(--win-line);border-radius:10px;background:linear-gradient(var(--win-a),var(--win-b));color:#fff;font:400 clamp(14px,2.4vw,20px)/1.5 var(--f-d);text-shadow:1px 1px 0 #000;box-shadow:0 0 0 3px var(--ink);animation:ban 3.2s ease both;pointer-events:none;text-align:center}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* 쯔꾸르식 파란 창 */
.rpg{position:relative;background:linear-gradient(var(--win-a),var(--win-b));color:var(--win-ink);border:3px solid var(--win-line);border-radius:10px;
  box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px rgba(130,160,255,.55),0 8px 0 3px rgba(31,42,68,.15);text-shadow:1px 1px 0 rgba(0,0,0,.65);line-height:1.6}
.msg{padding:16px 20px 26px;min-height:128px;cursor:pointer;margin-top:6px;font-size:17px}
.msg .name{position:absolute;left:14px;top:-16px;padding:0 12px;border:3px solid var(--win-line);border-radius:8px;background:linear-gradient(var(--win-a),var(--win-b));box-shadow:0 0 0 3px var(--ink);font:400 16px/1.6 var(--f-d)}
.msg .text{margin:0;white-space:pre-wrap;word-break:keep-all;min-height:3.2em}
.msg .next{position:absolute;right:16px;bottom:6px;font-size:14px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.msg .gain{display:block;margin-top:6px;color:#ffe27a;font-size:15px}
.choices{padding:8px;display:grid;gap:2px;margin-top:6px}
.choice{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 14px 9px 34px;color:#fff;text-shadow:inherit;cursor:pointer;position:relative;font-size:16px;line-height:1.45}
.choice::before{content:"▶";position:absolute;left:12px;top:9px;font-size:13px;opacity:0;color:#ffe27a}
.choice:hover,.choice.sel,.choice:focus-visible{background:rgba(255,255,255,.16);outline:none}
.choice:hover::before,.choice.sel::before,.choice:focus-visible::before{opacity:1}
.choice .tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:#ffe27a;color:#4a3300;font-size:12px;font-weight:800;text-shadow:none;vertical-align:1px}
.choice .need{display:block;font-size:13px;color:var(--win-dim)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice:disabled:hover{background:none}
.choice:disabled::before{opacity:0}

/* 상태창 */
.status{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.status .who{display:flex;align-items:center;gap:10px}
.status .who canvas{width:44px;height:48px;image-rendering:pixelated;background:rgba(255,255,255,.12);border-radius:8px;flex:none}
.status h2{margin:0;font-size:22px;line-height:1.2}
.status .sub{font-size:13px;color:var(--win-dim)}
.stat{display:grid;grid-template-columns:42px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.stat .bar{height:11px;border-radius:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.35);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;transition:width .5s}
.stat b{font-family:var(--f-d);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.stat .dl{position:absolute;right:8px;font-size:13px;font-weight:800}
.stat{position:relative}
.focusrow{margin-top:6px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.35)}
.focusrow .ft{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.focusrow .ft small{color:var(--win-dim);font-size:11px}
.focusrow .fb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fbtn{border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.28);color:#fff;border-radius:8px;padding:4px 0;font:400 14px/1.3 var(--f-d);text-shadow:inherit;cursor:pointer;position:relative}
.fbtn:hover{background:rgba(255,255,255,.16)}
.fbtn:active{transform:translateY(1px)}
.fbtn.on{background:var(--fc);border-color:#fff;color:#1f2a44;text-shadow:none;box-shadow:0 0 0 2px var(--ink)}
.fbtn:disabled{opacity:.45;cursor:not-allowed}
.dl.up{color:#9dffb0}.dl.dn{color:#ffb0a0}
.logbox{border-top:1px dashed rgba(255,255,255,.4);padding-top:8px}
.logbox h3{margin:0 0 4px;font-size:16px}
.log{margin:0;padding:0;list-style:none;max-height:210px;overflow:auto;font-size:13px;line-height:1.5;color:var(--win-dim)}
.log li{padding:2px 0}
.log li b{color:#fff;font-weight:600}
.log:empty::before{content:"아직 기록이 없어요";}

/* 종이 카드 (시작·만들기·결말) */
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:28px}
.card .lead{color:var(--sub);margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.cls-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.cl{border:2px solid #e7dfcf;background:#fff;border-radius:16px;padding:10px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.cl canvas{width:48px;height:54px;image-rendering:pixelated}
.cl b{font-family:var(--f-d);font-weight:400;font-size:21px}
.cl small{color:var(--sub);font-size:12px;line-height:1.35}
.cl .mini{font-size:11px;color:var(--ink);background:var(--soft2);border-radius:999px;padding:1px 8px;margin-top:2px}
.cl.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid #e7dfcf;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700}
.chips button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
label.f{display:block;font-weight:800;margin:14px 0 6px}
input[type=text]{width:100%;max-width:340px;border:2px solid #e7dfcf;border-radius:12px;padding:9px 12px;background:#fff;font:inherit;color:var(--ink)}
input[type=text]:focus{border-color:var(--accent);outline:none}
.tip{margin-top:14px;border-left:5px solid var(--teal);background:var(--soft2);border-radius:0 12px 12px 0;padding:9px 14px;font-size:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.how div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}
.how b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--accent)}
.end-title{font-size:34px;margin:0}
.end-flag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-size:13px;font-weight:800;margin-bottom:8px}
.end-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.end-stats div{background:var(--soft);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.end-stats b{display:block;font-family:var(--f-d);font-weight:400;font-size:26px;color:var(--ink)}
.timeline{margin:10px 0 0;padding:0;list-style:none;border-left:3px solid var(--ink);display:grid;gap:6px;font-size:14px}
.timeline li{padding-left:12px;position:relative}
.timeline li::before{content:"";position:absolute;left:-8px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.timeline b{color:var(--accent)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.dex div{border:2px solid #e7dfcf;border-radius:14px;padding:10px;background:#fff;font-size:13px;color:var(--sub);min-width:0}
.dex div b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--ink)}
.dex div.lock{background:#f3efe4}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,42,68,.7);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
footer{text-align:center;color:var(--sub);font-size:13px;margin-top:20px}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .cls-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .how{grid-template-columns:minmax(0,1fr)}
  .end-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top h1{font-size:24px}
  .msg{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.banner{animation:none}.msg .next{animation:none}}
</style>
<style>

.layout{grid-template-columns:minmax(0,1fr)}

.speed .age{font-family:var(--f-d);font-size:28px;line-height:1;margin-right:6px;font-variant-numeric:tabular-nums}
.speed .age small{font-family:var(--f-b);font-size:12px;color:var(--sub);margin-left:6px}

.feedcard .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.birth{padding:0;overflow:hidden}

.birth .bh code{font:600 12px ui-monospace,Menlo,Consolas,monospace;opacity:.85}
.birth .bb{padding:18px 20px 20px}
.birth .lab{font-size:12px;color:var(--sub)}
.bname{font-family:var(--f-d);font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0}

.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:16px 0}

.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--sub);font-weight:400}

.vtag{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--teal)}

.bars{margin-top:8px}

.bars .bar i{display:block;height:100%;background:var(--teal)}

.memo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.memo div{border:2px solid #e7dfcf;border-radius:14px;padding:8px 10px;font-size:13px;background:#fff;color:var(--sub);min-width:0}

.sectitle{font-size:13px;color:var(--sub);margin:16px 0 0}

<style>
/* 쯔꾸르(RPG 메이커)식으로 전체 통일: 남색 바탕, 파란 창, 흰 테두리, 검은 외곽선 글씨, ▶ 커서 */
:root{
  --f-d:'DotGothic16','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-b:'DotGothic16','Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --bg:#0a1030; --wa:#2c4fb8; --wb:#0e2060; --wc:#0a1750; --line2:#f4f1e6; --hi:#ffe27a; --dim2:#b9c6f2; --edge:#05081f; --mint:#7ff0dc;
  --outline:1px 0 #000,-1px 0 #000,0 1px #000,0 -1px #000,2px 2px 0 rgba(0,0,0,.55);
}
body{background-color:var(--bg);color:#fff;font-weight:600;font-size:16px;text-shadow:var(--outline);text-rendering:optimizeSpeed;

const mapCv=$('#map'),mx=mapCv.getContext('2d');mx.imageSmoothingEnabled=false;

let world=null,viewCls='pyung',viewSex='m',npcLoc=null,curLoc='home',walk=null,lastTs=0;
const hero={x:4*T+8,y:6*T+14,fr:0};
function setWorld(cls){viewCls=cls;world=buildWorld(cls)}
function bfs(a,b){const key=(x,y)=>x+','+y,q=[a],prev={[key(a[0],a[1])]:null};
  while(q.length){const [x,y]=q.shift();if(x===b[0]&&y===b[1])break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=x+dx,ny=y+dy,k=key(nx,ny);if(PATHS.has(k)&&!(k in prev)){prev[k]=[x,y];q.push([nx,ny])}})}
  const out=[];let cur=[b[0],b[1]];if(!(key(b[0],b[1]) in prev))return [b];
  while(cur){out.unshift(cur);cur=prev[key(cur[0],cur[1])]}return out}
function walkTo(loc){return new Promise(res=>{const d=DOOR[loc],sx=clamp(Math.round((hero.x-8)/T),0,COLS-1),sy=clamp(Math.round((hero.y-14)/T),0,ROWS-1);
  npcLoc=null;setSignOn(null);const pts=bfs([sx,sy],d).map(([x,y])=>[x*T+8,y*T+14]);walk={pts,i:0,res,sound:0};curLoc=loc})}
function frame(ts){const dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;
  if(!world)setWorld(viewCls);
  if(walk){const p=walk.pts[walk.i];if(!p){const r=walk.res;walk=null;r();}
    else{const dx=p[0]-hero.x,dy=p[1]-hero.y,dist=Math.hypot(dx,dy),sp=64*dt*walkMul;
      if(dist<=sp){hero.x=p[0];hero.y=p[1];walk.i++}else{hero.x+=dx/dist*sp;hero.y+=dy/dist*sp}
      walk.sound+=dt;if(walk.sound>.22){walk.sound=0;beep(170,.03,'square',.012)}}}
  mx.drawImage(world,0,0);
  const walking=!!walk,fr=walking?Math.floor(ts/110)%4:0;
  if(npcLoc){const d=DOOR[npcLoc],nx=d[0]*T+8+(npcLoc==='office'||npcLoc==='temple'?-13:13),ny=d[1]*T+14;drawPerson(mx,nx,ny,NPC[npcLoc],Math.floor(ts/500)%2?0:2);
    const by=ny-30+Math.round(Math.sin(ts/220)*1.5);rect(mx,'#1f2a44',nx-4,by-1,9,12);rect(mx,'#fff',nx-3,by,7,10);rect(mx,'#ff6b4a',nx,by+2,1,4);rect(mx,'#ff6b4a',nx,by+7,1,1)}
  drawPerson(mx,Math.round(hero.x),Math.round(hero.y),personStyle(viewCls,viewSex),fr);
  requestAnimationFrame(frame)}

const GL_KEYS=Object.keys(GLOSS).sort((a,b)=>b.length-a.length);
const GL_EXC={'국문':/국문(연구소|헌)/g,'고변':/임술삼고변/g,'두레':/두레박/g};
function glossFind(text){let t=String(text||'');const hits=[];
  for(const k of GL_KEYS){let u=t;if(GL_EXC[k])u=u.replace(GL_EXC[k],m=>' '.repeat(m.length));const i=u.indexOf(k);if(i>=0){hits.push([i,k]);t=t.split(k).join(' '.repeat(k.length))}}
  return hits.sort((a,b)=>a[0]-b[0]).map(h=>h[1])}
let GL_CTX='';
function showGloss(texts){const el=$('#gloss');if(!el)return;const seen=[];
  texts.forEach(t=>glossFind(t).forEach(k=>{if(!seen.includes(k))seen.push(k)}));
  if(!seen.length){el.hidden=true;el.innerHTML='';return}
  el.innerHTML=seen.slice(0,4).map(k=>'<div><b>'+esc(k)+'</b>'+esc(GLOSS[k])+'</div>').join('');el.hidden=false}
function hideGloss(){const el=$('#gloss');if(el){el.hidden=true;el.innerHTML=''}}
function addLog(age,text,o){o=o||{};const li=document.createElement('li');li.className=o.tone||'';

  const f=$('#feed');f.insertBefore(li,f.firstChild);while(f.children.length>90)f.lastChild.remove()}
function applyFx(fx){const d={};for(const k in fx){const b=G.s[k];G.s[k]=clamp(b+fx[k],0,100);d[k]=G.s[k]-b}return d}
function fmtGain(d){const a=Object.keys(d).filter(k=>d[k]!==0).map(k=>SL[k]+' '+(d[k]>0?'+':'')+d[k]);return a.length?'▶ '+a.join(' · '):''}

function norm(p){return typeof p==='string'?{who:'',text:p}:Array.isArray(p)?{who:p[0],text:p[1]}:p}
async function say(pages,id){ensureConsole();$('#choicebox').innerHTML='';
  for(const raw of pages){if(id!==runId)return;const p=norm(raw);await typePage(p.who||'',fillN(p.text),p.gain)}}
function typePage(who,text,gain){return new Promise(res=>{
  $('#msgbox').innerHTML='<div class="rpg msg" tabindex="0" role="button" aria-label="다음 대사">'+(who?'<span class="name">'+esc(who)+'</span>':'')+'<p class="text"></p><span class="next" hidden>▼</span></div>';
  GL_CTX=text;showGloss([text]);const el=$('#msgbox .msg'),tx=el.querySelector('.text'),nx=el.querySelector('.next');let i=0,done=false,timer=null,auto=null;
  const cleanup=()=>{clearInterval(timer);clearTimeout(auto);el.removeEventListener('click',adv);document.removeEventListener('keydown',key)};
  const fin=()=>{if(done)return;done=true;clearInterval(timer);tx.textContent=text;if(gain){const g=document.createElement('span');g.className='gain';g.textContent=gain;tx.appendChild(g)}nx.hidden=false;
    if(G&&G.autoD)auto=setTimeout(()=>{cleanup();curCleanup=null;res()},1100)};
  function adv(){if(!done){fin();return}cleanup();curCleanup=null;res()}
  function key(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();adv()}}
  curCleanup=cleanup;el.addEventListener('click',adv);document.addEventListener('keydown',key);
  timer=setInterval(()=>{i++;tx.textContent=text.slice(0,i);if(i%3===0)sfx.type();if(i>=text.length)fin()},G&&G.autoD?6:24)})}
function ask(items){return new Promise(res=>{const cb=$('#choicebox');
  cb.innerHTML='<div class="rpg choices" role="listbox">'+items.map((o,i)=>'<button class="choice" data-i="'+i+'" '+(o.dis?'disabled':'')+'>'+(i+1)+'. '+esc(o.t)+(o.tag?'<span class="tag">'+o.tag+'</span>':'')+(o.need?'<span class="need">'+esc(o.need)+'</span>':'')+'</button>').join('')+'</div>';
  showGloss([GL_CTX].concat(items.map(o=>o.t)));const btns=[...cb.querySelectorAll('.choice')];let sel=items.findIndex(o=>!o.dis);if(btns[sel])btns[sel].classList.add('sel');let at=null;
  const cleanup=()=>{clearTimeout(at);cb.removeEventListener('click',onc);document.removeEventListener('keydown',key)};
  const pick=i=>{cleanup();curCleanup=null;cb.innerHTML='';sfx.pick();res(i)};
  function onc(e){const b=e.target.closest('.choice');if(b&&!b.disabled)pick(+b.dataset.i)}
  function key(e){const n=parseInt(e.key,10);if(n>=1&&n<=items.length&&!items[n-1].dis){pick(n-1);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let j=sel;do{j=(j+(e.key==='ArrowDown'?1:-1)+items.length)%items.length}while(items[j].dis);btns.forEach(b=>b.classList.remove('sel'));sel=j;btns[j].classList.add('sel');btns[j].focus()}
    else if(e.key==='Enter'&&sel>=0&&document.activeElement.tagName!=='BUTTON'){pick(sel)}}
  curCleanup=cleanup;cb.addEventListener('click',onc);document.addEventListener('keydown',key);

  return !e.who||e.who.includes(G.cls)}
function passOK(p){if(G.cls==='wang')return !!p.who&&p.who.includes('wang');
  return !p.who||p.who.includes(G.cls)||(G.cls==='gwi'&&p.who.includes('yang'))}
function pickEvent(){const a=G.age;
  if(!String(G.lastEv||'').startsWith('x')&&G.cls!=='wang'&&Math.random()<.4){const y=G.year+a,hx=HXE.filter(e=>e.yr===y&&a>=e.a[0]&&a<=e.a[1]&&!G.used.has(e.id));if(hx.length)return R(hx)}
  const pool=EV.filter(e=>a>=e.a[0]&&a<=e.a[1]&&whoOK(e)&&(!e.sex||e.sex===G.sex)&&(!e.req||e.req(G))&&!(e.once&&G.used.has(e.id))&&G.lastEv!==e.id&&e.id!=='ilsang');
  if(!pool.length)return EV.find(e=>e.id==='ilsang');
  const hs=pool.filter(e=>e.h);if(hs.length&&Math.random()<.65)return hs[Math.floor(Math.random()*hs.length)];
  const up=(c,k)=>(c.fx&&c.fx[k]>0)||(c.chk&&c.chk.ok&&c.chk.ok.fx&&c.chk.ok.fx[k]>0),
    ws=pool.map(e=>(e.w||1)*(G.used.has(e.id)?.55:1)*(G.focus&&e.c&&e.c.some(c=>up(c,G.focus))?1.8:1)),tot=ws.reduce((x,y)=>x+y,0);let r=Math.random()*tot;
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i]}return pool[0]}
async function waitYear(id){const base=G.skip?25:3600/G.speed;let t=0;
  while(t<base){if(id!==runId)return false;await sleep(40);if(!G.paused&&!G.busy)t+=40}return id===runId}
async function runEvent(ev,id){
  G.busy=true;G.skip=false;updateSpeed();showBanner(G.age+'세 · '+(ev.h?(G.year+G.age)+'년 · ':'')+ev.t);
  await walkTo(ev.loc);if(id!==runId)return;
  npcLoc=ev.loc;setSignOn(ev.loc);G.lastEv=ev.id;G.used.add(ev.id);
  await say(ev.p,id);if(id!==runId)return;
  const opts=ev.c.map(ch=>{const lack=ch.need&&Object.keys(ch.need).find(k=>G.s[k]<ch.need[k]);
    return{t:ch.t,tag:ch.chk?'도전':'',dis:!!lack,need:ch.need?Object.entries(ch.need).map(([k,v])=>SL[k]+' '+v).join(', ')+' 필요'+(lack?' (부족)':''):''}});
  const i=await ask(opts);if(id!==runId)return;
  const ch=ev.c[i];let ok=true,res=ch;
  if(ch.chk){const c=ch.chk;ok=c.s?(G.s[c.s]+Math.random()*30-15>=c.n):Math.random()<c.p;res=ok?c.ok:c.ng}
  if(res.kid){if(res.kid>0){const boy=Math.random()<.5;G.kids=(G.kids||0)+res.kid;if(boy)G.sons=(G.sons||0)+1;G.lastBirth=G.age;
    res=Object.assign({},res,{r:res.r+' '+(boy?'대문에 숯과 붉은 고추를 단 금줄이 걸렸다. 아들이다!':'대문에 숯과 푸른 솔가지를 단 금줄이 걸렸다. 딸이다!')})}
  else G.kids=Math.max(0,(G.kids||0)+res.kid)}
  const d=applyFx(res.fx||{});if(res.flag){G.flags.add(res.flag);if(res.flag==='married')G.flags.delete('betrothed')}if(res.die)G.execd=res.die;if(res.inv){G.inv=G.inv||{};G.inv[res.inv]=(G.inv[res.inv]||0)+1}if(res.clr)G.inv={};if(res.cls){G.cls=res.cls;setWorld(G.cls)}
  ok?sfx.ok():sfx.no();
  await say([{text:(ch.chk?(ok?'【성공!】 ':'【실패…】 '):'')+res.r,gain:fmtGain(d)}],id);if(id!==runId)return;
  addLog(G.age,(ev.h?'['+(G.year+G.age)+'년] ':'')+ev.t+' — '+ch.t+'. '+res.r,{note:NOTES[ev.id]||ev.note,tone:ch.chk?(ok?'good':'bad'):''});
  G.chron.push({age:G.age,t:ev.t,c:ch.t,r:ch.chk?(ok?'성공':'실패'):''});
  hideGloss();npcLoc=null;setSignOn(null);G.busy=false;updateStatus(d);setIdle(ev.t+'을(를) 마치고, 다시 일상으로 돌아왔다.');
  if(res.next&&id===runId&&!G.execd){const ne=EV.find(e=>e.id===res.next);if(ne)await runEvent(ne,id)}}
async function lifeLoop(id){
  while(id===runId&&!G.dead){
    if(!(await waitYear(id)))return;
    G.age++;yearTick();invTick();
    const dk=checkDeath();if(dk){await endLife(id,dk);return}
    const d=G.age===1?await dolJabi(id):passiveLine();if(id!==runId)return;
    if(!G.skip&&Math.random()<.4)walkTo(R(Object.keys(LOCN)));
    if(G.age>=MAXAGE){G.hap[G.age]=calcHap();await endLife(id,'old');return}
    if(G.age>=7){const p=clamp(.2+.07*G.since,0,.9)*(G.age>=70?.5:1);
      if(Math.random()<p){const ev=pickEvent();if(ev){G.since=0;await runEvent(ev,id);if(id!==runId)return;if(G.execd){G.hap[G.age]=calcHap();await endLife(id,'treason');return}if(G.s.hp<=0){G.hap[G.age]=calcHap();await endLife(id,'hp');return}}else G.since++}else G.since++}
    G.hap[G.age]=calcHap();updateStatus(d);saveGame()}}

/* ============ 엔딩 ============ */
const ENDHINT={sage:'관직에서 청렴하게 일하고 명예 80 이상',corrupt:'관직에서 뇌물을 받고 재물 60 이상',freed:'노비로 태어나 면천에 성공',scholar:'학문 80 이상',rich:'재물 90 이상',hero:'명예 70 이상',beloved:'인연 85 이상',longlife:'건강하게 78세까지 살기',plain:'특별한 업적 없이 성실하게',early:'일찍 세상을 떠나기',pillar:'명문가에서 태어나 명예 75·재물 60 이상',royal:'왕실에서 태어나 명예 70 이상으로 60세까지 살기',exile:'왕족으로 태어나 권력 다툼에서 모함당하기',executed:'난에 가담했다 붙잡혀 처형당하기',sayak:'왕족·명문가로서 역모에 연루되어 사약 받기',exile2:'역모에 연루되었다가 유배형을 받기'};
function pickEnding(kind){const f=G.flags,s=G.s;
  if(kind==='treason')return (G.cls==='wang'||G.cls==='gwi')?'sayak':'executed';
  if(kind==='infant'||kind==='hp'||G.age<45)return 'early';
  if(f.has('exiled'))return G.cls==='wang'?'exile':'exile2';
  if(G.cls==='wang'&&s.hn>=70&&G.age>=60)return 'royal'
  if(f.has('official')&&s.hn>=80&&!f.has('corrupt'))return 'sage';
  if(f.has('corrupt')&&s.wl>=60)return 'corrupt';
  if(G.cls==='gwi'&&s.hn>=75&&s.wl>=60&&!f.has('corrupt'))return 'pillar';
  if(f.has('freed'))return 'freed';
  if(s.lr>=80)return 'scholar';
  if(s.wl>=90||(f.has('merchant')&&s.wl>=75))return 'rich';
  if(s.hn>=70)return 'hero';
  if(s.bd>=85)return 'beloved';
  if(s.hp>=70&&G.age>=MAXAGE)return 'longlife';
  return 'plain'}
async function endLife(id,kind){
  G.dead=true;G.busy=true;G.deathAge=G.age;store.set('jo.save',null);npcLoc=null;setSignOn(null);
  const key=pickEnding(kind),E=ENDS[key];
  const msg=kind==='treason'?((G.cls==='wang'||G.cls==='gwi')?'어명이 내려 사약 그릇이 앞에 놓였다.':'역적으로 몰려 끝내 형장에 끌려갔다.'):kind==='infant'?'어린 나이에 병을 이기지 못하고 세상을 떠났다.':kind==='hp'?'기력이 다해 자리에 눕고 말았다.':G.age>=MAXAGE?'오래도록 살아 천수를 누렸다.':'조용히 눈을 감았다.';
  addLog(G.age,msg,{tone:'bold'});updateStatus();
  const dex=store.get('jo.dex',[]),isNew=!dex.includes(key);if(isNew){dex.push(key);store.set('jo.dex',dex)}
  const past=store.get('jo.past',[]);past.unshift({name:G.name,cls:G.cls,age:G.age,end:E.n,reign:G.reign});store.set('jo.past',past.slice(0,8));
  sfx.born();await say([msg,'— 결말 — '+E.n],id);if(id!==runId)return;showEnding(key,isNew)}
function showEnding(key,isNew){const E=ENDS[key],dex=store.get('jo.dex',[]);abortUI();
  $('#console').innerHTML='<div class="card"><span class="end-flag">'+CL[G.cls].n+'으로 태어나 '+G.age+'세에 마침'+(isNew?' · 새 엔딩!':'')+'</span><h2 class="end-title">'+E.n+'</h2><p class="lead" style="margin-top:6px">'+esc(E.e)+'</p>'+
   '<div class="end-stats">'+STATS.map(([k,l])=>'<div>'+l+'<b>'+G.s[k]+'</b></div>').join('')+'</div>'+
   '<h3 style="margin:8px 0 4px;font-size:20px">걸어온 길</h3><ul class="timeline"><li><b>0세</b> '+esc(G.reign)+', '+esc(G.place)+'의 '+CL[G.cls].n+' 집안에서 태어남</li>'+
   G.chron.map(c=>'<li><b>'+c.age+'세</b> '+esc(c.t)+' — '+esc(c.c)+(c.r?' ('+c.r+')':'')+'</li>').join('')+'<li><b>'+G.age+'세</b> '+esc(E.n)+'</li></ul>'+
   '<div class="row" style="margin-top:16px"><button class="btn pri" data-act="again">다시 태어나기</button><button class="btn" data-act="dex">엔딩 도감 ('+dex.length+'/'+END_ORDER.length+')</button></div></div>'}

/* ============ 시작 · 출생 신고 ============ */
function resetHero(){hero.x=4*T+8;hero.y=6*T+14;walk=null;npcLoc=null;setSignOn(null)}
function hideGameUI(){$('#speedbar').hidden=true;$('#side').hidden=true;$('#feedcard').hidden=true;$('#layout').classList.remove('playing');fit()}
function renderTitle(){runId++;abortUI();G=null;hideGameUI();setWorld('pyung');viewSex='m';resetHero();buildLabels();
  const sv=store.get('jo.save',null),past=store.get('jo.past',[]),dist=[['평민',55],['노비',34],['양반',5.5],['중인',3],['명문가',2],['왕실',0.5]];
  $('#console').innerHTML='<div class="card"><div class="title-grid"><div class="tcol"><div class="vtag">v0.1 · 무료 · 조선 시대 인생 시뮬레이션</div>'+
   '<div class="hero-num">100분의 <em>1</em></div>'+
   '<p class="lead" style="font-size:17px">조선 백성 100명이 태어난다면, 양반은 몇 명일까요? 어느 집에서 태어날지는 고를 수 없어요. 당신이 그랬던 것처럼.</p>'+
   '<div class="how"><div><b>태어나기</b>신분·고향·집안이 무작위로 정해져요</div><div><b>살아가기</b>1년씩 지나가다 결정의 순간에 멈춰요</div><div><b>한평생</b>고른 길에 따라 서로 다른 결말이 나와요</div></div>'+
   '<div class="row"><button class="btn pri" data-act="born" style="font-size:18px;padding:12px 26px">태어나기</button>'+(sv?'<button class="btn tea" data-act="resume" style="font-size:18px;padding:12px 26px;margin-left:10px">이어하기 ('+sv.age+'세 · '+esc(sv.name)+')</button>':'')+'</div></div>'+
   '<div><h3 style="margin:0;font-size:22px">조선 백성 100명이 태어난다면</h3><div class="bars">'+dist.map(d=>'<div><span>'+d[0]+'</span><span class="bar"><i style="width:'+d[1]+'%"></i></span><b>'+d[1]+'%</b></div>').join('')+'</div>'+
   '<p class="lmcap">학자마다 추정이 달라요. 조선 전·중기를 단순화한 값이에요. 왕실은 실제로는 훨씬 드물지만, 만나 볼 수 있도록 조금 넣었어요.</p>'+
   '<p class="sectitle">'+(past.length?'지난 삶':'아직 지나간 삶이 없어요. 첫 삶을 시작해 보세요.')+'</p>'+
   (past.length?'<div class="memo">'+past.slice(0,4).map(p=>'<div><b>'+esc(p.name)+'</b>'+CL[p.cls].n+' · '+p.age+'세<br>'+esc(p.end)+'</div>').join('')+'</div>':'')+'</div></div></div>'}
function stars(n){return '<span class="dots">'+'●'.repeat(n)+'<span>'+'○'.repeat(5-n)+'</span></span>'}
function showBirth(b){abortUI();curBirth=b;setWorld(b.cls);viewSex=b.sex;resetHero();sfx.born();
  $('#console').innerHTML='<div class="card birth"><div class="bh"><span>출생 신고</span><code>No. '+b.no+'</code></div><div class="bb">'+
   '<div class="lab">이름</div><h2 class="bname">'+esc(b.name)+'</h2>'+
   '<p class="bdesc">'+esc(b.reign)+'('+b.year+'년) '+b.mo+'월, '+esc(b.place)+'의 '+CL[b.cls].n+' 집안에서 '+(b.sex==='m'?'남':'여')+'자아이로 태어났습니다. '+(b.order===1?'첫째':b.order===2?'둘째':'셋째')+'입니다.</p>'+
   '<div class="info"><div><small>성별</small><b>'+(b.sex==='m'?'남성':'여성')+'</b></div><div><small>신분</small><b>'+CL[b.cls].n+'</b></div><div><small>출생지</small><b>'+esc(b.place)+'</b></div>'+
   '<div><small>가정 형편</small><b>'+stars(b.fam)+'</b></div><div><small>부모 나이</small><b>아버지 '+b.pa[0]+'세 · 어머니 '+b.pa[1]+'세</b></div><div><small>부모님 일</small><b>'+esc(b.job)+'</b></div>'+
   '<div><small>사는 집</small><b>'+esc(b.house)+'</b></div><div><small>교육 기회</small><b>'+EDU[b.cls]+'</b></div><div><small>5세 전 사망 확률</small><b>'+U5[b.cls]+'%</b></div></div>'+
   '<table class="cmp"><thead><tr><th>같은 날 태어났다면</th><th>이 아이의 조선</th><th>오늘의 대한민국</th></tr></thead><tbody><tr><td>기대수명(추정)</td><td>'+EXP[b.cls]+'세</td><td>약 83세</td></tr><tr><td>5세 전 사망 확률</td><td>'+U5[b.cls]+'%</td><td>0.3% 안팎</td></tr></tbody></table>'+
   '<p class="lmcap">숫자는 이해를 돕기 위해 단순화한 추정값이에요. 이 기록은 이야기 속 인물이에요.</p>'+
   '<div class="row" style="margin-top:14px"><button class="btn pri" data-act="start">이 삶을 시작하기</button></div></div></div>'}
function startLife(b){abortUI();runId++;const id=runId,base=CL[b.cls].st,s={};
  for(const k in base)s[k]=clamp(base[k]+Math.floor(Math.random()*11)-5,0,100);
  G=Object.assign({},b,{age:0,s,flags:new Set(),used:new Set(),chron:[],hap:[],since:0,speed:Number(store.get('jo.spd',1)),paused:false,skip:false,autoD:false,busy:false,dead:false,lastEv:null,focus:null,kids:0,sons:0});
  G.hap[0]=calcHap();setWorld(G.cls);viewSex=G.sex;resetHero();buildLabels();
  $('#layout').classList.add('playing');$('#side').hidden=false;$('#feedcard').hidden=false;$('#feed').innerHTML='';buildLM();
  addLog(0,b.reign+'('+b.year+'년) '+b.mo+'월, '+b.place+'의 '+CL[b.cls].n+' 집안에서 '+(b.sex==='m'?'남':'여')+'자아이로 태어났습니다.',{tone:'bold'});
  updateStatus();setIdle('세상에 첫울음을 터뜨렸다. 이제 세월이 흐르기 시작한다.');window.scrollTo(0,0);fit();lifeLoop(id)}

/* ============ 저장 · 이어하기 (localStorage) ============ */
function saveGame(){if(!G||G.dead)return;
  const g=JSON.parse(JSON.stringify(G,(k,v)=>v instanceof Set?{__set:[...v]}:v));
  g.feedHtml=$('#feed').innerHTML;store.set('jo.save',g)}
function resumeLife(g){if(!g)return renderTitle();abortUI();runId++;const id=runId;
  g.flags=new Set((g.flags&&g.flags.__set)||[]);g.used=new Set((g.used&&g.used.__set)||[]);
  g.hap=(g.hap||[]).map(v=>v==null?0:v);
  G=Object.assign(g,{paused:false,skip:false,busy:false,dead:false,autoD:false,speed:Number(store.get('jo.spd',1))});
  setWorld(G.cls);viewSex=G.sex;resetHero();buildLabels();
  $('#layout').classList.add('playing');$('#side').hidden=false;$('#feedcard').hidden=false;
  $('#feed').innerHTML=g.feedHtml||'';buildLM();updateStatus();
  setIdle('저장해 둔 삶을 이어 간다.');window.scrollTo(0,0);fit();lifeLoop(id)}
window.addEventListener('pagehide',()=>{try{saveGame()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{saveGame()}catch(e){}});

/* ============ 도감 · 이벤트 연결 ============ */
function showDex(){const dex=store.get('jo.dex',[]);const o=document.createElement('div');o.className='overlay';o.id='dexov';
  o.innerHTML='<div class="card" role="dialog" aria-label="엔딩 도감"><div class="row" style="justify-content:space-between"><h2 style="margin:0">엔딩 도감 <small style="font-size:14px;color:var(--sub)">'+dex.length+'/'+END_ORDER.length+'</small></h2><button class="btn sm" data-act="dexclose">닫기</button></div><div class="dex">'+
   END_ORDER.map(k=>dex.includes(k)?'<div><b>'+ENDS[k].n+'</b>'+esc(ENDS[k].e)+'</div>':'<div class="lock"><b>???</b>힌트: '+ENDHINT[k]+'</div>').join('')+'</div></div>';
  document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)o.remove()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('#dexov');if(o)o.remove();if($('#trov'))closeTrain()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='born')showBirth(rollBirth());
  else if(a==='start')startLife(curBirth);
  else if(a==='train')showTrain();else if(a==='trclose')closeTrain();else if(a==='trbuy')trBuy(v);
  else if(a==='invest')showInvest();else if(a==='ivclose')closeInvest();else if(a==='ivbuy')ivTrade(v,false);else if(a==='ivsell')ivTrade(v,true);
  else if(a==='resume')resumeLife(store.get('jo.save',null));
  else if(a==='title'||a==='again')renderTitle();
  else if(a==='dex')showDex();
  else if(a==='dexclose'){const o=$('#dexov');if(o)o.remove()}
  else if(G){
    if(a==='pause'){G.paused=!G.paused;updateSpeed()}
    else if(a==='sp'){G.speed=Number(v);G.skip=false;store.set('jo.spd',G.speed);updateSpeed()}
    else if(a==='skip'){G.skip=true;G.paused=false;updateSpeed()}
    else if(a==='autod'){G.autoD=!G.autoD;updateSpeed()}
    else if(a==='focus'&&!G.dead){const same=G.focus===v;G.focus=same?null:v;sfx.pick();addLog(G.age,same?'한 가지에 매이지 않고 두루 살피기로 했다.':'이제부터 '+SL[v]+'에 마음을 쏟기로 했다.');updateStatus();saveGame()}}});
$('#btnDex').addEventListener('click',showDex);
function syncSound(){$('#btnSound').textContent=soundOn?'소리 켜짐':'소리 꺼짐'}
$('#btnSound').addEventListener('click',()=>{soundOn=!soundOn;store.set('jo.sound',soundOn);syncSound();if(soundOn)sfx.pick()});
syncSound();setWorld('pyung');buildLabels();renderTitle();
</script>
