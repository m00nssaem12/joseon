<style>
/* 레이아웃: 왼쪽에 타일맵과 대화창, 오른쪽에 상태창. 좁은 화면에서는 한 줄로 쌓인다. 단일 테마(밝은 한지 바탕 + 쯔꾸르식 파란 창)로 의도적으로 고정 */
:root{
  --paper:#fbf6ec; --dot:#e7dfcf; --ink:#1f2a44; --sub:#5b6478; --accent:#ff6b4a; --teal:#2bb3a3; --gold:#f2b632;
  --card:#fffdf8; --soft:#fff1e6; --soft2:#e6f6f3;
  --win-a:#2c4fb8; --win-b:#0e2060; --win-line:#f4f1e6; --win-ink:#ffffff; --win-dim:#b9c6f2;
  --c-lr:#6c95ff; --c-wl:#f2b632; --c-hn:#b98cff; --c-hp:#ff7a5c; --c-bd:#ff6fae;
  --shadow:0 2px 0 rgba(31,42,68,.08),0 8px 24px rgba(31,42,68,.08);
  --f-d:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-b:'Gothic A1','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.55;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;
  padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.jua{font-family:var(--f-d);font-weight:400;letter-spacing:-.2px;text-wrap:balance}
button{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seal{width:46px;height:46px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-d);font-size:26px;box-shadow:var(--shadow);transform:rotate(-4deg);border:2px solid var(--ink)}
.top h1{margin:0;font-size:30px;line-height:1.1}
.top small{display:block;color:var(--sub);font-size:13px}
.top .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:9px 16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:transform .05s}
.btn:active{transform:translateY(2px)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.tea{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:10px}
.btn.ghost{border-color:#d9d0bd}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}

/* 맵 */
.stage{position:relative;border:3px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);background:#7cc368;line-height:0}
#map{display:block;width:100%;height:auto;aspect-ratio:10/7;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;transform:translate(-50%,-100%);background:rgba(31,42,68,.86);color:#fff;border:2px solid var(--win-line);border-radius:6px;padding:0 6px;font:400 clamp(10px,1.7vw,14px)/1.5 var(--f-d);white-space:nowrap;pointer-events:none}
.sign.on{background:var(--accent);border-color:#fff}
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:92%;padding:4px 16px;border:3px solid var(--win-line);border-radius:10px;background:linear-gradient(var(--win-a),var(--win-b));color:#fff;font:400 clamp(14px,2.4vw,20px)/1.5 var(--f-d);text-shadow:1px 1px 0 #000;box-shadow:0 0 0 3px var(--ink);animation:ban 3.2s ease both;pointer-events:none;text-align:center}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* 쯔꾸르식 파란 창 */
.rpg{position:relative;background:linear-gradient(var(--win-a),var(--win-b));color:var(--win-ink);border:3px solid var(--win-line);border-radius:10px;
  box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px rgba(130,160,255,.55),0 8px 0 3px rgba(31,42,68,.15);text-shadow:1px 1px 0 rgba(0,0,0,.65);line-height:1.6}
.msg{padding:16px 20px 26px;min-height:128px;cursor:pointer;margin-top:6px;font-size:17px}
.msg .name{position:absolute;left:14px;top:-16px;padding:0 12px;border:3px solid var(--win-line);border-radius:8px;background:linear-gradient(var(--win-a),var(--win-b));box-shadow:0 0 0 3px var(--ink);font:400 16px/1.6 var(--f-d)}
.msg .text{margin:0;white-space:pre-wrap;word-break:keep-all;min-height:3.2em}
.msg .next{position:absolute;right:16px;bottom:6px;font-size:14px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.msg .gain{display:block;margin-top:6px;color:#ffe27a;font-size:15px}
.choices{padding:8px;display:grid;gap:2px;margin-top:6px}
.choice{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 14px 9px 34px;color:#fff;text-shadow:inherit;cursor:pointer;position:relative;font-size:16px;line-height:1.45}
.choice::before{content:"▶";position:absolute;left:12px;top:9px;font-size:13px;opacity:0;color:#ffe27a}
.choice:hover,.choice.sel,.choice:focus-visible{background:rgba(255,255,255,.16);outline:none}
.choice:hover::before,.choice.sel::before,.choice:focus-visible::before{opacity:1}
.choice .tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:#ffe27a;color:#4a3300;font-size:12px;font-weight:800;text-shadow:none;vertical-align:1px}
.choice .need{display:block;font-size:13px;color:var(--win-dim)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice:disabled:hover{background:none}
.choice:disabled::before{opacity:0}

/* 상태창 */
.status{padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.status .who{display:flex;align-items:center;gap:10px}
.status .who canvas{width:44px;height:48px;image-rendering:pixelated;background:rgba(255,255,255,.12);border-radius:8px;flex:none}
.status h2{margin:0;font-size:22px;line-height:1.2}
.status .sub{font-size:13px;color:var(--win-dim)}
.stat{display:grid;grid-template-columns:42px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.stat .bar{height:11px;border-radius:6px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.35);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;transition:width .5s}
.stat b{font-family:var(--f-d);font-weight:400;text-align:right;font-variant-numeric:tabular-nums}
.stat .dl{position:absolute;right:8px;font-size:13px;font-weight:800}
.stat{position:relative}
.focusrow{margin-top:6px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.35)}
.focusrow .ft{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:5px}
.focusrow .ft small{color:var(--win-dim);font-size:11px}
.focusrow .fb{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.fbtn{border:2px solid rgba(255,255,255,.45);background:rgba(0,0,0,.28);color:#fff;border-radius:8px;padding:4px 0;font:400 14px/1.3 var(--f-d);text-shadow:inherit;cursor:pointer;position:relative}
.fbtn:hover{background:rgba(255,255,255,.16)}
.fbtn:active{transform:translateY(1px)}
.fbtn.on{background:var(--fc);border-color:#fff;color:#1f2a44;text-shadow:none;box-shadow:0 0 0 2px var(--ink)}
.fbtn:disabled{opacity:.45;cursor:not-allowed}
.dl.up{color:#9dffb0}.dl.dn{color:#ffb0a0}
.logbox{border-top:1px dashed rgba(255,255,255,.4);padding-top:8px}
.logbox h3{margin:0 0 4px;font-size:16px}
.log{margin:0;padding:0;list-style:none;max-height:210px;overflow:auto;font-size:13px;line-height:1.5;color:var(--win-dim)}
.log li{padding:2px 0}
.log li b{color:#fff;font-weight:600}
.log:empty::before{content:"아직 기록이 없어요";}

/* 종이 카드 (시작·만들기·결말) */
.card{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 4px;font-size:28px}
.card .lead{color:var(--sub);margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:10px}
.cls-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.cl{border:2px solid #e7dfcf;background:#fff;border-radius:16px;padding:10px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.cl canvas{width:48px;height:54px;image-rendering:pixelated}
.cl b{font-family:var(--f-d);font-weight:400;font-size:21px}
.cl small{color:var(--sub);font-size:12px;line-height:1.35}
.cl .mini{font-size:11px;color:var(--ink);background:var(--soft2);border-radius:999px;padding:1px 8px;margin-top:2px}
.cl.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:2px solid #e7dfcf;background:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:700}
.chips button.on{border-color:var(--accent);background:var(--soft);color:var(--accent)}
label.f{display:block;font-weight:800;margin:14px 0 6px}
input[type=text]{width:100%;max-width:340px;border:2px solid #e7dfcf;border-radius:12px;padding:9px 12px;background:#fff;font:inherit;color:var(--ink)}
input[type=text]:focus{border-color:var(--accent);outline:none}
.tip{margin-top:14px;border-left:5px solid var(--teal);background:var(--soft2);border-radius:0 12px 12px 0;padding:9px 14px;font-size:14px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.how div{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:14px}
.how b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--accent)}
.end-title{font-size:34px;margin:0}
.end-flag{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 14px;font-size:13px;font-weight:800;margin-bottom:8px}
.end-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0}
.end-stats div{background:var(--soft);border-radius:12px;padding:8px 4px;text-align:center;font-size:13px;color:var(--sub);font-weight:700}
.end-stats b{display:block;font-family:var(--f-d);font-weight:400;font-size:26px;color:var(--ink)}
.timeline{margin:10px 0 0;padding:0;list-style:none;border-left:3px solid var(--ink);display:grid;gap:6px;font-size:14px}
.timeline li{padding-left:12px;position:relative}
.timeline li::before{content:"";position:absolute;left:-8px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.timeline b{color:var(--accent)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.dex div{border:2px solid #e7dfcf;border-radius:14px;padding:10px;background:#fff;font-size:13px;color:var(--sub);min-width:0}
.dex div b{display:block;font-family:var(--f-d);font-weight:400;font-size:17px;color:var(--ink)}
.dex div.lock{background:#f3efe4}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(31,42,68,.7);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:640px;width:100%;max-height:90vh;overflow:auto}
footer{text-align:center;color:var(--sub);font-size:13px;margin-top:20px}

@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .cls-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .how{grid-template-columns:minmax(0,1fr)}
  .end-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .top h1{font-size:24px}
  .msg{font-size:16px}
}
@media (prefers-reduced-motion:reduce){.banner{animation:none}.msg .next{animation:none}}

.side .feedcard{flex:none!important}.layout.ended .side .feedcard{order:9}.side .feed{max-height:230px!important}
@media (min-width:861px){.layout.playing .side{overflow-y:auto!important;scrollbar-width:thin}}
.silrok{margin:8px 0 10px;padding:8px 12px;border-left:3px solid #a3251c;background:rgba(163,37,28,.06);border-radius:0 6px 6px 0}.silrok small{display:block;font-size:12px;color:#a3251c;font-weight:700;letter-spacing:1px}.silrok p{margin:2px 0 0;font-family:var(--f-t);font-size:15px;line-height:1.6}
.altc{margin:8px 0 12px;padding:10px 12px;border:1px dashed rgba(0,0,0,.25);border-radius:8px}.altc .me{margin:4px 0 8px}.altc .me b{color:#2f6b57}.altc ul{margin:0;padding-left:18px}.altc li{margin:4px 0}.altc li b{color:#a3251c}
</style>
<style>
/* 진행 화면: 속도 바 · 인생 기록 · 인생 지도 · 출생 신고서 · 시작 화면 */
.layout{grid-template-columns:minmax(0,1fr)}
@media (min-width:861px){.layout.playing{grid-template-columns:minmax(0,1fr) 300px}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.speed{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:var(--shadow)}
.speed .age{font-family:var(--f-d);font-size:28px;line-height:1;margin-right:6px;font-variant-numeric:tabular-nums}
.speed .age small{font-family:var(--f-b);font-size:12px;color:var(--sub);margin-left:6px}
.speed .grow{flex:1;min-width:8px}
.speed button{border:2px solid #d9d0bd;background:#fff;border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;cursor:pointer}
.speed button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.speed button:disabled{opacity:.4;cursor:not-allowed}
.feedcard .fh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.feedcard h2{font-size:24px;margin:0}
.feedcard small{color:var(--sub);font-size:12px}
.feed{list-style:none;margin:8px 0 0;padding:0;max-height:360px;overflow:auto}
.feed li{display:grid;grid-template-columns:46px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid #eee4d0;font-size:15px}
.feed .a{color:var(--sub);font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;padding-top:4px}
.feed .t{word-break:keep-all}
.feed .src{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.45}
.feed .src b{color:var(--teal);margin-right:4px}
.feed li.bad .t{color:#c0392b}
.feed li.bold .t{font-weight:800}
.feed li.good .t{color:#16786d}
.lm{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:8px}
.lm i{aspect-ratio:1;border-radius:3px;background:#ece6d6;display:block}
.lm i.cur{outline:2px solid var(--accent);outline-offset:1px}
.lm i.dead{background:repeating-linear-gradient(45deg,#d6d0c2,#d6d0c2 2px,#e6e1d4 2px,#e6e1d4 4px)}
.lmcap{font-size:12px;color:var(--sub);margin:6px 0 0}
.mapcard h3{margin:0;font-size:20px}
.birth{padding:0;overflow:hidden}
.birth .bh{background:var(--ink);color:#fff;padding:11px 20px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-d);font-size:20px}
.birth .bh code{font:600 12px ui-monospace,Menlo,Consolas,monospace;opacity:.85}
.birth .bb{padding:18px 20px 20px}
.birth .lab{font-size:12px;color:var(--sub)}
.bname{font-family:var(--f-d);font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0}
.bdesc{color:var(--sub);margin:6px 0 0}
.info{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 18px;margin:16px 0}
.info small{display:block;color:var(--sub);font-size:12px}
.info b{font-size:16px;word-break:keep-all}
.dots{letter-spacing:2px;color:var(--accent)}
.dots span{color:#d9d0bd}
.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.cmp th,.cmp td{padding:6px 4px;border-top:1px dashed #d9d0bd;text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--sub);font-weight:400}
.cmp td:last-child{font-weight:800}
.hero-num{font-family:var(--f-d);font-size:clamp(64px,14vw,132px);line-height:.95;margin:6px 0 4px}
.hero-num em{font-style:normal;color:var(--accent)}
.vtag{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--teal)}
.title-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
.bars{margin-top:8px}
.bars div{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;margin:7px 0;font-size:14px}
.bars .bar{height:10px;border-radius:5px;background:#eee7d6;overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--teal)}
.bars b{font:600 13px ui-monospace,Menlo,Consolas,monospace;text-align:right;color:var(--sub)}
.glossbox{margin-top:12px;padding:10px 12px;border:1px dashed rgba(128,128,128,.6);border-radius:6px;font-size:14px;line-height:1.55;text-align:left}.glossbox h4{margin:0 0 6px;font-size:14px}.glossbox b{margin-right:6px}.glossbox div+div{margin-top:4px}
.memo{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.memo div{border:2px solid #e7dfcf;border-radius:14px;padding:8px 10px;font-size:13px;background:#fff;color:var(--sub);min-width:0}
.memo div b{display:block;font-size:15px;color:var(--ink)}
.pickgrid{margin-top:12px}
.sectitle{font-size:13px;color:var(--sub);margin:16px 0 0}
.flagrow{display:flex;gap:6px;flex-wrap:wrap}
.flagrow span{font-size:12px;background:rgba(255,255,255,.18);border-radius:999px;padding:0 8px}
@media (max-width:860px){.title-grid{grid-template-columns:minmax(0,1fr)}.info{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* 한 화면에 맞추기: 선택창은 지도 위, 기록은 오른쪽 칸 안에서 스크롤 */
.top{margin-bottom:8px}

{id:'p_anyongbok',h:1,loc:'market',a:[10,70],w:9,once:true,req:g=>g.year+g.age>=1693&&g.year+g.age<=1696&&/동래/.test(g.place||''),t:'동래 사람 안용복',
 note:'안용복은 동래의 어부였어요. 1693년과 1696년 울릉도에 들어온 일본 어부들과 맞서고 일본에 건너가 울릉도와 독도가 조선 땅임을 주장했어요. 이 일 뒤 일본 막부는 일본인이 울릉도에 가지 못하게 했어요.',
 p:['포구에서 안용복이라는 어부가 사람들을 모아 놓고 열변을 토한다.',['안용복','"울릉도와 우산도(독도)는 우리 땅이오! 왜 어부들이 우리 바다에서 고기를 잡게 둘 수 있소!"']],
 c:[{t:'"맞소!" 하고 힘을 보탠다',fx:{hn:8,bd:3},r:'포구 사람들이 하나둘 목소리를 보탰다.'},
    {t:'그의 배에 올라 울릉도로 함께 간다',chk:{s:'hp',n:50,ok:{fx:{hn:14,hp:-4},r:'거친 바다를 건너 울릉도에 닿았다. 왜 어부들을 꾸짖어 몰아냈다!'},ng:{fx:{hp:-10},r:'풍랑에 배가 흔들려 큰 고생만 하고 돌아왔다.'}}},
    {t:'괜히 나섰다 화를 입을까 지켜만 본다',fx:{wl:2},r:'멀리서 지켜보았다. 마음 한구석이 무거웠다.'}]},
{id:'p_kimhongdo',h:1,loc:'market',a:[7,70],w:8,once:true,req:g=>g.year+g.age>=1772&&g.year+g.age<=1805&&/한양|수원/.test(g.place||''),t:'그림 그리는 화원 김홍도',
 note:'김홍도(1745~?)는 나라의 그림을 그리던 도화서 화원이에요. 서당·씨름·빨래터처럼 평범한 사람들의 모습을 생생하게 그린 풍속화로 유명해요. 정조의 명으로 수원 화성 행차 그림에도 참여했어요.',
 p:['장터 한쪽에 한 선비가 앉아 붓을 놀린다. 씨름하는 사람들을 그리고 있다.',['구경꾼','"저 양반이 김홍도라네! 임금님 그림도 그린다는 화원이야."']],
 c:[{t:'씨름판에 나가 그림 속 사람이 되어 본다',chk:{s:'hp',n:45,ok:{fx:{hn:8,bd:5},r:'상대를 번쩍 들어 넘겼다! 화원이 빙그레 웃으며 붓을 놀렸다.'},ng:{fx:{hp:-3,bd:4},r:'벌러덩 넘어졌다. 구경꾼들이 깔깔 웃는다. 그 모습도 그림에 담겼다.'}}},
    {t:'그림 그리는 법을 여쭌다',fx:{lr:6,hn:2},r:'"보이는 대로, 사람 사는 대로 그리면 되오." 붓 잡는 법을 배웠다.'},
    {t:'구경꾼들 틈에서 그림을 구경한다',fx:{bd:3,hn:2},r:'붓끝에서 사람들이 살아 움직이는 것 같았다.'}]},
{id:'p_bakjiwon',h:1,loc:'school',a:[10,70],w:8,once:true,req:g=>g.year+g.age>=1781&&g.year+g.age<=1791&&/한양/.test(g.place||'')&&g.cls!=='wang',t:'열하를 다녀온 선비 박지원',
 note:'박지원(1737~1805)은 청나라를 다녀와 《열하일기》를 쓴 실학자예요. 수레와 벽돌을 쓰고 상공업을 일으켜 백성의 살림을 넉넉하게 하자고 주장했어요(북학). 《양반전》, 《허생전》 같은 소설로 양반의 허례허식을 꼬집기도 했어요.',
 p:['사랑방에 사람들이 모였다. 청나라를 다녀온 박지원이 이야기를 풀어놓는다.',['박지원','"청나라에서는 수레가 길을 가득 메우고 벽돌로 집을 짓더이다. 우리도 배울 것은 배워야 하오!"']],
 c:[{t:'청나라 이야기를 귀 기울여 듣는다',fx:{lr:7},r:'수레, 벽돌, 배… 세상이 넓다는 것을 처음 느꼈다.'},
    {t:'《양반전》 이야기를 듣고 함께 웃는다',fx:{bd:5,hn:2},r:'체면만 차리는 양반을 꼬집는 이야기에 배를 잡고 웃었다.'},
    {t:'"오랑캐에게 뭘 배운단 말이오!" 하고 따진다',fx:{hn:2,lr:-2},r:'박지원은 허허 웃으며 "좋은 것은 누구에게서든 배워야지요." 했다.'}]},
{id:'p_chusa',h:1,loc:'school',a:[8,70],w:9,once:true,req:g=>g.year+g.age>=1841&&g.year+g.age<=1848&&/제주/.test(g.place||''),t:'유배 온 추사 김정희',
 note:'김정희(1786~1856)는 \'추사체\'라는 독특한 글씨로 유명한 학자예요. 1840년부터 9년 동안 제주에 유배되어 지내면서 추사체를 완성하고 〈세한도〉를 그렸어요. 제주 사람들에게 글과 글씨도 가르쳤어요.',
 p:['대정 고을에 한양에서 큰 학자가 귀양을 왔다고 한다.',['김정희','"추운 겨울이 되어서야 소나무와 잣나무가 늦게 시드는 것을 안다 하였지…"']],
 c:[{t:'찾아가 글씨를 배운다',fx:{lr:9,hn:3},r:'굵고 가는 획이 춤추는 듯한 글씨를 따라 써 보았다.'},
    {t:'귤 한 바구니를 갖다 드린다',fx:{bd:7,wl:-1},r:'"제주 귤이 참 달구려." 쓸쓸하던 얼굴에 웃음이 번졌다.'},
    {t:'멀리서 인사만 한다',fx:{hn:1},r:'귀양 온 사람이라 가까이하기가 조심스러웠다.'}]},
{id:'p_dasan',h:1,loc:'school',a:[8,70],w:9,once:true,req:g=>g.year+g.age>=1802&&g.year+g.age<=1818&&/전라도/.test(g.place||''),t:'강진에 유배 온 정약용',
 note:'정약용(1762~1836)은 거중기를 설계한 실학자예요. 1801년 신유박해로 전라도 강진에 18년 동안 유배되었고, 다산초당에서 제자를 가르치며 《목민심서》 등 500여 권의 책을 썼어요.',
 p:['강진 다산초당에 유배 온 선비가 아이들을 모아 가르친다는 소문이 들린다.',['정약용','"수령은 백성을 위해 있는 것이지, 백성이 수령을 위해 있는 것이 아니다."']],
 c:[{t:'초당을 찾아가 제자가 된다',fx:{lr:10,bd:3},r:'산길을 오르내리며 배웠다. 차 한 잔과 함께 듣는 이야기가 귀했다.'},
    {t:'우리 고을 사또의 횡포를 털어놓는다',fx:{hn:5,bd:2},r:'정약용이 고개를 끄덕이며 무언가를 적었다. 훗날 책에 담길 이야기였다.'},
    {t:'죄인이라며 가까이하지 않는다',fx:{wl:1},r:'귀양 온 죄인이라는 말에 발길을 돌렸다.'}]},
{id:'p_imsangok',h:1,loc:'market',a:[14,70],w:9,once:true,req:g=>g.year+g.age>=1810&&g.year+g.age<=1850&&/평안도/.test(g.place||''),t:'의주 거상 임상옥',
 note:'임상옥(1779~1855)은 의주의 큰 상인이에요. 청나라와 인삼 무역을 해서 큰돈을 벌었고, 청나라 상인들이 인삼 값을 깎으려 하자 인삼을 불태우는 척하며 제값을 받아 냈다는 이야기가 전해져요. 번 돈으로 굶주린 백성도 도왔어요.',
 p:['평양 장터에 의주의 큰 상인 임상옥의 상단이 지나간다.',['임상옥','"장사는 이익을 남기는 것이 아니라 사람을 남기는 것이오."']],
 c:[{t:'상단에 들어가 장사를 배운다',chk:{s:'lr',n:40,ok:{fx:{wl:12,hn:3},flag:'merchant',r:'인삼 짐을 나르며 셈과 흥정을 배웠다. 어느새 나도 상인이 되었다.'},ng:{fx:{hp:-4,wl:3},r:'짐만 나르다 돌아왔다. 그래도 품삯은 두둑했다.'}}},
    {t:'그 말을 마음에 새긴다',fx:{bd:5,lr:2},r:'"사람을 남기는 장사라…" 오래도록 그 말이 귓가에 맴돌았다.'},
    {t:'인삼 몇 뿌리를 사 둔다',need:{wl:6},fx:{wl:-6,hp:5},r:'달여 먹으니 기운이 솟는다.'}]},
{id:'p_kimjeongho',h:1,loc:'field',a:[10,75],w:5,once:true,req:g=>g.year+g.age>=1840&&g.year+g.age<=1864,t:'지도를 그리는 나그네',
 note:'김정호는 우리나라 전체를 22첩으로 나누어 그린 〈대동여지도〉(1861)를 만들었어요. 접으면 책처럼 들고 다닐 수 있었고, 산줄기와 물줄기, 길과 거리를 정밀하게 나타냈어요. 나무판에 새겨 여러 장을 찍어 낼 수 있게 했어요.',
 p:['낡은 봇짐을 멘 나그네가 붓과 종이를 들고 고개 위에 서 있다.',['나그네','"이 고개 너머 다음 고을까지는 몇 리나 되오? 저 냇물은 어디로 흘러가오?"']],
 c:[{t:'고갯길과 냇물을 하나하나 알려 준다',fx:{bd:6,lr:4},r:'나그네가 받아 적으며 고마워했다. 훗날 그 길이 지도에 실렸다.'},
    {t:'지도 그리는 법을 구경한다',fx:{lr:6},r:'산줄기를 굵은 선으로, 길을 가는 선으로 그리고 십 리마다 점을 찍었다.'},
    {t:'"지도는 나라 비밀이오!" 하고 의심한다',fx:{hn:1,bd:-2},r:'나그네는 쓴웃음을 짓고 다음 고개로 떠났다.'}]},
{id:'p_udu',h:1,loc:'office',a:[7,70],w:9,once:true,req:g=>g.year+g.age>=1880&&g.year+g.age<=1905,t:'우두 접종소',
 note:'지석영(1855~1935)은 일본에서 천연두(마마)를 막는 종두법을 배워 와 1879년부터 우두를 놓기 시작했어요. 소의 고름(우두)을 몸에 넣어 마마를 가볍게 앓게 하는 방법이었어요. 처음엔 사람들이 무서워했지만 점점 퍼져 많은 아이를 살렸어요.',
 p:['관아 앞에 우두를 놓아 준다는 방이 붙었다.',['지석영','"이것을 맞으면 마마에 걸리지 않소! 아이들부터 데려오시오."'],['동네 노인','"소 고름을 사람 몸에 넣다니, 소가 된다더라!"']],
 c:[{t:'식구들과 함께 우두를 맞는다',fx:{hp:5,lr:2},flag:'udu',r:'팔뚝이 조금 부었다 가라앉았다. 이제 마마 걱정은 덜었다.'},
    {t:'이웃들에게도 맞자고 권한다',fx:{bd:6,hp:3,hn:3},flag:'udu',r:'겁내던 이웃들을 달래 함께 줄을 섰다.'},
    {t:'"소가 된다던데…" 하며 피한다',fx:{wl:1},r:'끝내 맞지 않았다. 마마 소식이 들릴 때마다 가슴이 철렁한다.'}]},
{id:'p_nokdu',h:1,loc:'market',a:[14,70],w:10,once:true,req:g=>g.year+g.age>=1892&&g.year+g.age<=1894&&/전라도/.test(g.place||''),t:'녹두 장군 전봉준',
 note:'전봉준(1855~1895)은 키가 작아 \'녹두 장군\'이라 불렸어요. 1894년 고부 군수의 횡포에 맞서 농민들과 들고일어났고, 이것이 동학 농민 운동으로 커졌어요. "나쁜 관리를 없애고 외국 세력을 몰아내자"고 외쳤어요.',
 p:['장터 주막에서 키가 작은 사내가 사람들을 모아 이야기한다.',['전봉준','"군수가 물세를 억지로 거두어 백성이 굶고 있소. 이대로 두고만 볼 것이오?"']],
 c:[{t:'사발통문에 이름을 올린다',fx:{hn:10,bd:4},flag:'rebel',r:'누가 먼저인지 모르게 둥글게 이름을 적었다. 가슴이 두근거린다.'},
    {t:'곡식을 몰래 보태 돕는다',need:{wl:5},fx:{wl:-5,hn:6},r:'"고맙소." 녹두 장군이 두 손을 꼭 잡았다.'},
    {t:'괜히 화를 입을까 두려워 집으로 돌아간다',fx:{hp:1},r:'발걸음이 무거웠다.'}]},
{id:'gando',h:1,loc:'home',a:[16,55],w:6,once:true,req:g=>{const y=g.year+g.age;return y>=1869&&y<=1909&&!g.mv&&g.cls!=='wang'&&g.cls!=='gwi'&&(/평안도|함경도/.test(g.place||'')||g.s.wl<30)},t:'두만강 너머 새 땅',
 note:'1869년 큰 흉년 뒤 함경도·평안도 사람들이 두만강과 압록강을 건너 간도(만주)와 연해주(러시아)로 옮겨 가 땅을 일구기 시작했어요. 이후 이주민이 크게 늘어 많은 마을이 생겼고, 훗날 이곳은 독립운동의 중요한 근거지가 되었어요.',
 p:['흉년이 이어지자 이웃 몇 집이 짐을 쌌다.',['이웃','"두만강 건너 간도에는 빈 땅이 널렸다네. 거기 가서 농사지어 먹고살세."']],
 c:[{t:'두만강을 건너 간도로 떠난다',fx:{hp:-6,wl:6,bd:-4},mv:'북간도',flag:'migrant',r:'얼어붙은 강을 건너 낯선 땅에 움막을 지었다. 언 땅을 일구어 벼농사를 시작했다.'},
    {t:'더 멀리 연해주로 간다',fx:{hp:-8,wl:8,bd:-5},mv:'연해주',flag:'migrant',r:'러시아 땅 연해주에 닿았다. 조선 사람 마을이 벌써 몇 군데 있었다.'},
    {t:'조상 묘가 있는 고향에 남는다',fx:{bd:4,wl:-3},r:'떠나는 이웃들을 배웅했다. 고향 하늘이 쓸쓸하다.'}]},
{id:'hawaii',h:1,loc:'market',a:[16,42],w:10,once:true,req:g=>{const y=g.year+g.age;return y>=1903&&y<=1905&&!g.mv&&g.cls!=='wang'&&g.cls!=='gwi'},t:'하와이로 가는 배',
 note:'1903년 1월 102명의 한인을 태운 배가 하와이 호놀룰루에 도착했어요. 우리나라 최초의 공식 이민이에요. 1905년까지 약 7,000명이 하와이로 건너가 뙤약볕 아래 사탕수수 농장에서 일했고, 어렵게 번 돈을 모아 독립운동을 돕기도 했어요.',
 p:['제물포에 \'하와이 일꾼 모집\' 광고가 붙었다.',['모집인','"하와이에 가면 날씨는 일 년 내내 따뜻하고, 사탕수수 농장에서 일하면 한 달에 15달러를 준다오!"']],
 c:[{t:'이민선을 타고 하와이로 간다',fx:{hp:-4,wl:8,bd:-6},mv:'하와이',flag:'migrant',r:'몇 주 동안 배를 타고 바다를 건넜다. 뜨거운 햇볕 아래 사탕수수밭이 끝없이 펼쳐져 있었다.'},
    {t:'멀고 낯선 곳은 두렵다며 남는다',fx:{bd:3},r:'떠나는 배를 바라보며 손을 흔들었다.'}]},
{id:'gungnyeo',loc:'office',a:[8,13],who:['pyung','jung','nobi'],sex:'f',w:3,once:true,req:g=>!g.mv,t:'궁녀로 뽑히다',

function invTick(){if(!G.inv)return;const msgs=[];let net=0;
  for(const k in G.inv){const n=Math.min(G.inv[k],3);if(!INV[k]||n<1)continue;
    for(let i=0;i<n;i++){const r=INV[k].run(),fx={};for(const x in r)if(x!=='m')fx[x]=r[x];applyFx(fx);net+=fx.wl||0;if(r.m)msgs.push(INV[k].n+': '+r.m)}}
  if(msgs.length)addLog(G.age,'[투자] '+msgs.join(' '),{tone:net<0?'bad':'good'})}
const invCnt=(g,k)=>(g.inv&&g.inv[k])||0;

  o.innerHTML='<div class="card" role="dialog" aria-label="투자"><div class="row" style="justify-content:space-between"><h2 style="margin:0">투자 <small style="font-size:15px">재물 '+G.s.wl+'</small></h2><button class="btn sm" data-act="ivclose">닫기</button></div>'+

   Object.keys(INV).filter(k=>!(k==='ship'&&G.cls==='nobi')).map(k=>{const n=invCnt(G,k),c=INVI[k][0];
    return '<div class="iv"><div><b>'+INV[k].n+'</b> <small>가격 '+c+' · 보유 '+n+'/3</small><br><small>'+INVI[k][1]+'</small></div><div class="ivb"><button class="btn sm" data-act="ivbuy" data-v="'+k+'" '+(n>=3||G.s.wl<c?'disabled':'')+'>사기</button><button class="btn sm ghost" data-act="ivsell" data-v="'+k+'" '+(n<1?'disabled':'')+'>팔기</button></div></div>'}).join('')+'</div></div>'}

function showGloss(texts){const el=$('#gloss');if(!el)return;const seen=[];
  texts.forEach(t=>glossFind(t).forEach(k=>{if(!seen.includes(k))seen.push(k)}));
  if(!seen.length){el.hidden=true;el.innerHTML='';return}
  el.innerHTML=seen.slice(0,4).map(k=>'<div><b>'+esc(k)+'</b>'+esc(GLOSS[k])+'</div>').join('');el.hidden=false}
function glossBox(texts,max){const seen=[];texts.forEach(t=>glossFind(t).forEach(k=>{if(!seen.includes(k))seen.push(k)}));if(!seen.length)return '';return '<div class="glossbox"><h4>낱말 풀이</h4>'+seen.slice(0,max||8).map(k=>'<div><b>'+esc(k)+'</b>'+esc(GLOSS[k])+'</div>').join('')+'</div>'}
function hideGloss(){const el=$('#gloss');if(el){el.hidden=true;el.innerHTML=''}}
function addLog(age,text,o){o=o||{};const li=document.createElement('li');li.className=o.tone||'';
  li.innerHTML='<span class="a">'+age+'세</span><div class="t">'+esc(fillN(text))+(o.note?'<div class="src"><b>자료</b>'+esc(o.note)+'</div>':'')+(()=>{const gk=glossFind(text).slice(0,3);return gk.length?'<div class="src"><b>뜻</b>'+gk.map(k=>esc(k)+': '+esc(GLOSS[k])).join(' · ')+'</div>':''})()+'</div>';
  const f=$('#feed');f.insertBefore(li,f.firstChild);while(f.children.length>90)f.lastChild.remove();try{applyFF()}catch(e){}}
function applyFx(fx){const d={};for(const k in fx){const b=G.s[k];let v=fx[k];if(k==='bd'&&v>0)v=Math.max(1,Math.round(v*.7));G.s[k]=clamp(b+v,0,100);d[k]=G.s[k]-b}return d}
function fmtGain(d){const a=Object.keys(d).filter(k=>d[k]!==0).map(k=>SL[k]+' '+(d[k]>0?'+':'')+d[k]);return a.length?'▶ '+a.join(' · '):''}

/* ============ 대화창 · 선택창 (쯔꾸르식) ============ */
function norm(p){return typeof p==='string'?{who:'',text:p}:Array.isArray(p)?{who:p[0],text:p[1]}:p}
async function say(pages,id){ensureConsole();$('#choicebox').innerHTML='';
  for(const raw of pages){if(id!==runId)return;const p=norm(raw);await typePage(p.who||'',fillN(p.text),p.gain)}}
function typePage(who,text,gain){return new Promise(res=>{
  $('#msgbox').innerHTML='<div class="rpg msg" tabindex="0" role="button" aria-label="다음 대사">'+(who?'<span class="name">'+esc(who)+'</span>':'')+'<p class="text"></p><span class="next" hidden>▼</span></div>';
  GL_CTX=text;showGloss([text]);const el=$('#msgbox .msg'),tx=el.querySelector('.text'),nx=el.querySelector('.next');let i=0,done=false,timer=null,auto=null;
  const cleanup=()=>{clearInterval(timer);clearTimeout(auto);el.removeEventListener('click',adv);document.removeEventListener('keydown',key)};
  const fin=()=>{if(done)return;done=true;clearInterval(timer);tx.textContent=text;if(gain){const g=document.createElement('span');g.className='gain';g.textContent=gain;tx.appendChild(g)}nx.hidden=false;
    if(G&&G.autoD)auto=setTimeout(()=>{cleanup();curCleanup=null;res()},1100)};
  function adv(){if(!done){fin();return}cleanup();curCleanup=null;res()}
  function key(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();adv()}}
  curCleanup=cleanup;el.addEventListener('click',adv);document.addEventListener('keydown',key);
  timer=setInterval(()=>{i++;tx.textContent=text.slice(0,i);if(i%3===0)sfx.type();if(i>=text.length)fin()},G&&G.autoD?6:24)})}
function ask(items,intro,title,kind){const autoI=()=>{const ok=items.map((o,i)=>o.dis?-1:i).filter(i=>i>=0),f=ok.filter(i=>items[i].up);return f.length&&Math.random()<.7?R(f):R(ok)};return new Promise(res=>{const cb=$('#choicebox');cb.classList.remove('min');
  cb.innerHTML='<div class="rpg choices" role="listbox">'+(G?'<div class="dhead"><span>'+(kind||'중대 결정')+'</span><span class="dy">'+G.age+'세 · '+(G.year+G.age)+'년</span><button type="button" class="dmin">잠깐 내려 두기</button></div>'+(title?'<h3 class="dt">'+esc(title)+'</h3>':''):'')+(GL_CTX?'<p class="dq">'+esc(GL_CTX)+'</p>':'')+(intro?'<div class="crit">'+esc(intro)+'</div>':'')+items.map((o,i)=>'<button class="choice" data-i="'+i+'" '+(o.dis?'disabled':'')+'>'+(i+1)+'. '+esc(o.t)+(o.tag?'<span class="tag">'+o.tag+'</span>':'')+(o.need?'<span class="need">'+esc(o.need)+'</span>':'')+'</button>').join('')+(G&&!G.autoD?'<button class="autobtn" type="button">이제부터 결정을 자동으로 맡기기</button>':'')+'</div>';
  showGloss([GL_CTX].concat(items.map(o=>o.t)));const btns=[...cb.querySelectorAll('.choice')];let sel=items.findIndex(o=>!o.dis);if(btns[sel])btns[sel].classList.add('sel');let at=null;
  const cleanup=()=>{clearTimeout(at);cb.removeEventListener('click',onc);document.removeEventListener('keydown',key)};
  const pick=i=>{cleanup();curCleanup=null;cb.innerHTML='';sfx.pick();res(i)};
  function onc(e){if(e.target.closest('.dmin')){const m=cb.classList.toggle('min');e.target.closest('.dmin').textContent=m?'다시 펼치기':'잠깐 내려 두기';return}if(e.target.closest('.autobtn')){G.autoD=true;updateSpeed();pick(autoI());return}const b=e.target.closest('.choice');if(b&&!b.disabled)pick(+b.dataset.i)}
  function key(e){const n=parseInt(e.key,10);if(n>=1&&n<=items.length&&!items[n-1].dis){pick(n-1);return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();let j=sel;do{j=(j+(e.key==='ArrowDown'?1:-1)+items.length)%items.length}while(items[j].dis);btns.forEach(b=>b.classList.remove('sel'));sel=j;btns[j].classList.add('sel');btns[j].focus()}
    else if(e.key==='Enter'&&sel>=0&&document.activeElement.tagName!=='BUTTON'){pick(sel)}}
  curCleanup=cleanup;cb.addEventListener('click',onc);document.addEventListener('keydown',key);
  if(G&&G.autoD){at=setTimeout(()=>pick(autoI()),1100)}})}

const NOTES={honghwamun:'1750년 영조는 창경궁 홍화문에 나가 양반과 평민의 의견을 직접 들었어요(순문). 〈영조실록〉 26년 기록에 군역 문제로 고통받는 백성을 안타까워한 모습이 남아 있어요. 그 결과 균역법이 만들어졌어요.',sangpyeong:'상평통보(1678, 숙종 4년)는 영의정 허적의 건의로 만든 동전이에요. 엽전이라고도 부르며 조선 말까지 쓰였어요. 처음에는 백성들이 믿지 못해 쓰기를 꺼렸어요.',jongmo:'노비종모법(1731, 영조 7년)은 어머니가 노비일 때만 자식도 노비가 되게 한 법이에요. 이후 노비 수가 크게 줄어들었어요.',mandeok:'김만덕(1739~1812)은 제주의 큰 흉년(1790년대)에 전 재산으로 육지의 쌀을 사 굶주린 사람들을 구했어요. 〈정조실록〉에 그 이야기가 실려 있고, 정조는 소원이던 금강산 유람을 허락했어요.',sami:'1795년(정조 19) 정조는 어머니 혜경궁 홍씨의 회갑을 기념해 홍화문 밖에서 가난한 백성들에게 쌀을 나누어 주었어요.',byeongja:'병자호란(1636~1637)은 청나라가 쳐들어온 전쟁이에요. 인조는 1636년 12월 남한산성에 들어가 한 달 반 넘게 버텼지만, 1637년 1월 30일(음력) 삼전도에서 항복했어요. 〈인조실록〉에는 전쟁이 끝난 뒤 한양 길거리에 시체가 널려 있었다는 기록이 있어요.',daedong:'대동법은 공물 대신 쌀로 세금을 내게 한 제도예요. 경기도에서 시작해 약 100년에 걸쳐 전국으로 퍼졌어요.',gyeongsin:'경신대기근(1670~1671, 현종 11~12년)은 서리·우박과 전염병이 겹쳐 최소 100만 명이 숨진 것으로 추정되는 큰 기근이에요. 〈현종실록〉에는 진휼소에 모여든 굶주린 백성 사이에서 사망자가 속출했다는 기록이 있어요.',eulbyeong:'을병대기근(1695~1696, 숙종 21~22년)은 경신대기근에 이어 다시 닥친 큰 기근이에요.',gyunyeokbeop:'균역법(1750~1751, 영조 26~27년)은 군포를 2필에서 1필로 줄여 백성의 부담을 덜어 준 제도예요. 모자란 세금은 토지세(결작)와 어장·염전·선박세 등으로 채웠어요.',sinhae:'신해통공(1791)은 시전 상인의 독점(금난전권)을 풀어 누구나 장사할 수 있게 한 정책이에요. 육의전은 예외였어요.',hwaseong:'수원 화성(1794~1796)은 정조가 쌓은 성이에요. 정약용이 설계한 거중기를 쓰고, 일꾼에게 품삯을 주었어요.',gyeokjaeng:'격쟁은 임금이 행차할 때 징이나 꽹과리를 쳐서 억울함을 직접 알리던 제도예요. 정조 때 특히 활발했어요.',gongnobi:'1801년(순조 1) 중앙 관청에 매인 공노비 약 6만 6천 명을 풀어 주었어요. 개인 집의 사노비는 포함되지 않았어요.',hongnan:'홍경래의 난(1811~1812)은 서북 지역 차별과 세도 정권의 수탈에 맞서 평안도에서 일어난 봉기예요. 가산·정주 등 청천강 이북 10여 개 고을을 차지했지만 약 5개월 만에 진압되었어요.',imsul:'임술 농민 봉기(1862, 철종 13년)는 2월 진주에서 시작되어 삼남 일대로 퍼졌어요. 경상우병사 백낙신의 수탈에 분노한 농민(초군)들이 흰 수건을 두르고 진주성으로 몰려가, 잘못된 환곡·세금을 없앤다는 약속을 받아 냈어요. 조정은 삼정이정청을 두어 개혁을 시도했어요.',gyeongbok:'경복궁 중건(1865~1868) 비용을 마련하려고 원납전을 걷고 당백전을 발행하자 물가가 크게 올랐어요.',byeongin:'병인양요(1866)는 프랑스군이 강화도를 공격한 사건이에요. 프랑스군이 가져간 외규장각 의궤는 2011년에 5년마다 갱신하는 대여 방식으로 돌아왔어요.',gabo:'1894년 갑오개혁으로 양반·상민·노비 같은 신분 제도가 법적으로 없어졌어요. 하지만 차별이 사라지기까지는 오랜 시간이 걸렸어요.',danbal:'단발령(1895)은 상투를 자르게 한 명령이에요. 많은 사람이 반발했고, 을미의병이 일어난 계기 중 하나가 되었어요.',chun:'서당에서는 천자문을 시작으로 동몽선습, 명심보감 등을 배웠어요.',dam:'노비는 글을 배울 기회가 거의 없었지만, 어깨너머로 글을 익힌 사람도 있었어요.',

function survAge(cls){const u=Math.random()*100,P=survP(cls,G?G.year:null,G?G.place:null);for(let i=1;i<P.length;i++)if(u>=P[i][1]){const[p,q]=[P[i-1],P[i]];return Math.round(p[0]+(q[0]-p[0])*(p[1]-u)/(p[1]-q[1]))}return 80+Math.floor(Math.random()*6)}

   (b.rf?'<div class="tip" style="margin:0 0 10px">📜 실록에 기록된 실제 인물이에요. 책봉·혼인·즉위·가족의 일·세상을 떠나는 때는 기록을 따르고, 그 사이의 선택은 여러분이 해요.</div>':b.seoeol?'<div class="tip" style="margin:0 0 10px">🍂 서얼로 태어났어요. 양반 아버지와 첩 어머니 사이의 자녀라, 아버지가 양반이어도 문과 시험을 볼 수 없고 집안에서도 차별을 받아요.</div>':b.fict?'<div class="tip" style="margin:0 0 10px">🕯️ 실록에 따로 이름이 남지 않은 왕족이에요(이름은 지어낸 거예요). 아버지는 그때의 임금('+esc(reignOf(b.year).split(' ')[0])+')이지만, 이 아이의 삶은 여러분의 선택으로 만들어 가요.</div>':'')+'<p class="bdesc">'+esc(b.reign)+'('+b.year+'년) '+b.mo+'월, '+esc(b.place)+'의 '+clsWord(b)+' 집안에서 '+(b.sex==='m'?'남':'여')+'자아이로 태어났습니다. '+(b.rf?'':(b.order===1?'첫째':b.order===2?'둘째':'셋째')+'입니다.')+'</p>'+
   '<div class="info"><div><small>성별</small><b>'+(b.sex==='m'?'남성':'여성')+'</b></div><div><small>신분</small><b>'+clsName(b)+'</b></div><div><small>출생지</small><b>'+esc(b.place)+'</b></div>'+
   '<div><small>가정 형편</small><b>'+stars(b.fam)+'</b></div><div><small>부모 나이</small><b>아버지 '+b.pa[0]+'세 · 어머니 '+b.pa[1]+'세</b></div><div><small>부모님 일</small><b>'+esc(b.job)+'</b></div>'+
   '<div><small>사는 집</small><b>'+esc(b.house)+'</b></div><div><small>교육 기회</small><b>'+EDU[b.cls]+'</b></div><div><small>5세 전 사망 확률</small><b>약 '+Math.round(SIM(b.cls,b.year,b.place).d5)+'%</b></div></div>'+
   '<table class="cmp"><thead><tr><th>같은 날 태어났다면</th><th>이 아이의 조선</th><th>오늘의 대한민국</th></tr></thead><tbody><tr><td>기대수명(추정)</td><td>'+expOf(b.cls,b.year,b.place)+'세</td><td>약 83세</td></tr><tr><td>5세 전 사망 확률</td><td>약 '+Math.round(SIM(b.cls,b.year,b.place).d5)+'%</td><td>0.3% 안팎</td></tr></tbody></table>'+
   '<p class="lmcap">숫자는 이해를 돕기 위해 단순화한 추정값이에요. 이 기록은 이야기 속 인물이에요.</p>'+glossBox([b.reign,b.place,b.job,b.house,CL[b.cls].n,CL[b.cls].d,EDU[b.cls]],8)+
   '<div class="row" style="margin-top:14px"><button class="btn pri" data-act="start">이 삶을 시작하기</button></div></div></div>'}
function startLife(b){abortUI();runId++;const id=runId,base=CL[b.cls].st,s={};
  for(const k in base)s[k]=clamp(base[k]+Math.floor(Math.random()*11)-5,0,100);
  G=Object.assign({},b,{bcls:b.seoeol?'seoeol':b.cls,age:0,s,flags:new Set(),used:new Set(),chron:[],hap:[],since:0,speed:Number(store.get('jo.spd',1)),paused:false,skip:false,autoD:false,busy:false,dead:false,lastEv:null,focus:null,kids:0,sons:0});
  if(b.seoeol)G.flags.add('seoeol');
  G.hap[0]=calcHap();ensurePeers();setWorld(G.cls);viewSex=G.sex;resetHero();buildLabels();
  $('#layout').classList.remove('ended');$('#layout').classList.add('playing');$('#side').hidden=false;$('#feedcard').hidden=false;$('#feed').innerHTML='';buildLM();
  addLog(0,b.reign+'('+b.year+'년) '+b.mo+'월, '+b.place+'의 '+clsWord(b)+' 집안에서 '+(b.sex==='m'?'남':'여')+'자아이로 태어났습니다.',{tone:'bold'});
  updateStatus();setIdle('세상에 첫울음을 터뜨렸다. 이제 {n}의 삶이 시작된다.');window.scrollTo(0,0);fit();lifeLoop(id)}

/* ============ 저장 · 이어하기 (localStorage) ============ */
function saveGame(){if(!G||G.dead||G.busy)return;
  const g=JSON.parse(JSON.stringify(G,(k,v)=>v instanceof Set?{__set:[...v]}:v));
  g.feedHtml=$('#feed').innerHTML;store.set('jo.save',g)}
function resumeLife(g){if(!g)return renderTitle();abortUI();$('#layout').classList.remove('titlev');runId++;const id=runId;
  g.flags=new Set((g.flags&&g.flags.__set)||[]);g.used=new Set((g.used&&g.used.__set)||[]);
  g.hap=g.hap||[];
  G=Object.assign(g,{paused:false,skip:false,busy:false,dead:false,autoD:false,speed:Number(store.get('jo.spd',1))});ensurePeers();
  setWorld(G.cls);viewSex=G.sex;resetHero();buildLabels();
  $('#layout').classList.remove('ended');$('#layout').classList.add('playing');$('#side').hidden=false;$('#feedcard').hidden=false;
  $('#feed').innerHTML=g.feedHtml||'';buildLM();updateStatus();
  setIdle('저장해 둔 삶을 이어 간다.');window.scrollTo(0,0);fit();lifeLoop(id)}
window.addEventListener('pagehide',()=>{try{saveGame()}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)try{saveGame()}catch(e){}});

/* ============ 도감 · 이벤트 연결 ============ */
function showDex(){const dex=store.get('jo.dex',[]);const o=document.createElement('div');o.className='overlay';o.id='dexov';
  o.innerHTML='<div class="card" role="dialog" aria-label="엔딩 도감"><div class="row" style="justify-content:space-between"><h2 style="margin:0">엔딩 도감 <small style="font-size:14px;color:var(--sub)">'+dex.filter(k=>END_ORDER.includes(k)).length+'/'+END_ORDER.length+'</small></h2><button class="btn sm" data-act="dexclose">닫기</button></div><div class="dex">'+
   END_ORDER.map(k=>dex.includes(k)?'<div><b>'+ENDS[k].n+'</b>'+esc(ENDS[k].e)+'</div>':'<div class="lock"><b>???</b>힌트: '+ENDHINT[k]+'</div>').join('')+'</div></div>';
  document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)o.remove()})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('#dexov');if(o)o.remove();if($('#trov'))closeTrain()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='born')showBirth(rollBirth());
  else if(a==='start')startLife(curBirth);
  else if(a==='train')showTrain();else if(a==='trclose')closeTrain();else if(a==='trbuy')trBuy(v);
  else if(a==='invest')showInvest();else if(a==='ivclose')closeInvest();else if(a==='ivbuy')ivTrade(v,false);else if(a==='ivsell')ivTrade(v,true);
  else if(a==='resume')resumeLife(store.get('jo.save',null));
  else if(a==='title'||a==='again')renderTitle();
  else if(a==='dex')showDex();
  else if(a==='board')showBoard();
  else if(a==='bdmode'){BDM=v==='today'?'today':'all';showBoard()}
  else if(a==='codeok')codeOk();
  else if(a==='teacher')showTeacher();
  else if(a==='mkcode')mkCode();
  else if(a==='qrcode'){const m=store.get('jo.mycodes',[]).find(x=>x.c===v);if(m)$('#tcres').innerHTML=joinBox(m.c,m.n)}
  else if(a==='copylink'){const i=$('#jlink');if(i){i.select();(navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).catch(()=>document.execCommand('copy')).then(()=>{b.textContent='복사됨'})}}
  else if(a==='tcclose'){const o=$('#tcov');if(o)o.remove()}
  else if(a==='usecode'){const m=store.get('jo.mycodes',[]).find(x=>x.c===v);if(m){store.set('jo.class',m.c);store.set('jo.className',m.n)}const o=$('#tcov');if(o)o.remove();showBoard()}
  else if(a==='bdclose'){const o=$('#bdov');if(o)o.remove()}
  else if(a==='dexclose'){const o=$('#dexov');if(o)o.remove()}
  else if(G){
    if(a==='pause'){G.paused=!G.paused;updateSpeed()}
    else if(a==='sp'){G.speed=Number(v);G.skip=false;store.set('jo.spd',G.speed);updateSpeed()}
    else if(a==='skip'){G.skip=true;G.paused=false;updateSpeed()}
    else if(a==='autod'){G.autoD=!G.autoD;updateSpeed()}
    else if(a==='focus'&&!G.dead&&G.age>=FOCUS_AGE){const same=G.focus===v;G.focus=same?null:v;sfx.pick();addLog(G.age,same?'한 가지에 매이지 않고 두루 살피기로 했다.':'이제부터 '+focusName(v,G.age)+'에 마음을 쏟기로 했다.');updateStatus();saveGame()}}});
$('#btnDex').addEventListener('click',showDex);
function syncSound(){$('#btnSound').textContent=soundOn?'소리 켜짐':'소리 꺼짐'}
$('#btnSound').addEventListener('click',()=>{soundOn=!soundOn;store.set('jo.sound',soundOn);syncSound();if(soundOn)sfx.pick()});
syncSound();setWorld('pyung');buildLabels();renderTitle();
/* 링크(?c=코드)나 QR로 들어오면 학급을 바로 연결 */
(function(){let c=null;try{c=new URLSearchParams(location.search).get('c')}catch(e){}
  if(!c||!/^[A-Za-z]{3}[0-9]{3}$/.test(c))return;try{history.replaceState(null,'',location.pathname)}catch(e){}
  window.addEventListener('load',async()=>{let n;try{n=await JFB.codeName(c)}catch(e){}const msg=$('#codemsg'),inp=$('#clscode');
    if(n){store.set('jo.class',c);store.set('jo.className',n);if(inp)inp.value=c;if(msg)msg.textContent='✓ 링크로 '+n+' 결과판에 연결됐어요.';showBanner('✓ '+n+'에 연결됐어요')}
    else if(n===null){if(msg)msg.textContent='링크의 학급 코드를 찾을 수 없어요. 선생님께 다시 받아 주세요.'}
    else{store.set('jo.class',c);store.set('jo.className','우리 반');if(inp)inp.value=c;if(msg)msg.textContent='학급 코드 '+c+'를 넣어 두었어요.'}})})();
</script>

<button id="totop" type="button" hidden aria-label="맨 위로">▲ 맨 위로</button>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== Firebase: 엔딩 통계 · 접속 현황 · 같은 시기 태어난 사람들 (이름 없이 익명 저장) ===== */
const JFB=(()=>{const o={ok:false,stats:null,my:null,online:0};o.board=async()=>null;o.codeName=async()=>undefined;o.makeCode=async()=>({err:'offline'});
  o.render=()=>{const b=document.getElementById('fbstats');if(!b)return;const st=o.stats;
    const tot=st?Number(st.total)||0:0;if(!tot){b.innerHTML='';return}
    const cls=Object.entries(st.classes||{}).sort((a,b)=>b[1]-a[1]),end=Object.entries(st.endings||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
    b.innerHTML='<h3 style="margin:12px 0 4px;font-size:20px">지금까지 조선에서 태어난 사람들</h3><p style="margin:0 0 6px;font-size:14px">모두 <b>'+tot+'명</b>이 삶을 마쳤어요. (실시간)</p>'+
      cls.map(([k,v])=>{v=Number(v)||0;return CL[k]?'<div class="fbrow"><span>'+CL[k].n+'</span><i style="width:'+Math.max(3,Math.round(v/tot*100))+'%"></i><b>'+Math.round(v/tot*100)+'%</b></div>':''}).join('')+
      '<p style="margin:8px 0 0;font-size:13px">가장 많이 나온 엔딩: '+end.filter(([k])=>ENDS[k]).map(([k,v])=>ENDS[k].n+' '+(Number(v)||0)+'명').join(' · ')+'</p>'};
  o.record=async()=>{};o.loadSame=()=>{};
  try{if(!window.firebase)return o;
    firebase.initializeApp({apiKey:"AIzaSyC4Snm5wkqtcastgBWm7ELRAX3zWTzz5yM",authDomain:"joseon-d2dd3.firebaseapp.com",databaseURL:"https://joseon-d2dd3-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"joseon-d2dd3",storageBucket:"joseon-d2dd3.firebasestorage.app",messagingSenderId:"876755272861",appId:"1:876755272861:web:0af56c7093a01dd55b8074"});
    const db=firebase.database(),badge=document.createElement('div');badge.id='fbbadge';badge.hidden=true;document.body.appendChild(badge);
    o.ready=firebase.auth().signInAnonymously().then(c=>{o.ok=true;o.uid=c.user.uid;const me=db.ref('online/'+o.uid);
      me.onDisconnect().remove().then(()=>me.set(true));
      db.ref('online').on('value',sn=>{o.online=sn.numChildren();badge.textContent='지금 '+o.online+'명이 조선에서 살고 있어요';badge.hidden=false;const fo=document.getElementById('fbon');if(fo)fo.textContent='지금 '+o.online+'명이 함께 조선을 살고 있어요'});
      db.ref('stats').on('value',sn=>{o.stats=sn.val();o.render()})}).catch(e=>console.warn('firebase',e));
    o.record=async key=>{await o.ready;if(!o.ok||!G||G.fbDone)return;G.fbDone=1;
      const inc=p=>db.ref(p).transaction(v=>(v||0)+1);
      await Promise.all([inc('stats/total'),inc('stats/endings/'+key),inc('stats/classes/'+G.cls)]).catch(e=>console.warn(e));
      const r=db.ref('lives').push();o.my=r.key;
      await r.set({cls:G.cls,sex:G.sex,year:G.year,age:Math.min(G.age,130),end:key,ts:firebase.database.ServerValue.TIMESTAMP}).catch(e=>console.warn(e));
      const code=clsCode();if(code)await db.ref('classes/'+code).push().set({cls:G.cls,bcls:G.bcls||G.cls,sex:G.sex,year:G.year,age:Math.min(G.age,130),end:key,fr:G.flags.has('freed')?1:0,np:G.flags.has('napsok')?1:0,rf:G.rf?1:0,cl:G.cls,dc:G.dc||'weak',ts:firebase.database.ServerValue.TIMESTAMP}).catch(e=>console.warn(e))};
    o.codeName=async code=>{await o.ready;if(!o.ok)return undefined;if(!/^[A-Za-z]{3}[0-9]{3}$/.test(code))return null;const [sn,ss]=await Promise.all([db.ref('codes/'+code+'/n').once('value'),db.ref('codes/'+code+'/s').once('value')]);return sn.exists()?((ss.exists()?String(ss.val())+' ':'')+String(sn.val()||'우리 반')):null};
    o.makeCode=async(master,name,school)=>{await o.ready;if(!o.ok)return {err:'offline'};const L='ACDEFHJKMNPRTUVWXYadefhmnrt',D='3479';/* 헷갈리는 O0 I1L S5 Z2 B8 G6 Q, 대소문자 모양이 같은 c k p u v w x y 소문자는 쓰지 않음 */
      for(let t=0;t<3;t++){let c='';for(let i=0;i<3;i++)c+=L[Math.floor(Math.random()*L.length)];for(let i=0;i<3;i++)c+=D[Math.floor(Math.random()*D.length)];
        try{await db.ref('codes/'+c).set({k:master,n:name,s:school,ts:firebase.database.ServerValue.TIMESTAMP});return {code:c}}catch(e){if(t===2)return {err:'denied'}}}
      return {err:'denied'}};
    o.board=async code=>{await o.ready;if(!o.ok)return null;const sn=await db.ref('classes/'+code).orderByChild('ts').limitToLast(500).once('value');const rows=[];sn.forEach(c=>{rows.push(c.val())});return rows};
    o.loadSame=()=>{if(!o.ok||!G)return;db.ref('lives').orderByChild('year').startAt(G.year-3).endAt(G.year+3).limitToLast(8).once('value').then(sn=>{
      const rows=[];sn.forEach(c=>{if(c.key!==o.my)rows.push(c.val())});const b=document.getElementById('fbsame');if(!b)return;
      b.innerHTML=rows.length?'<h3 style="margin:12px 0 4px;font-size:20px">같은 시기에 태어난 사람들</h3>'+rows.reverse().map(r=>'<div class="fbl"><b>'+(CL[r.cls]?CL[r.cls].n:'')+' · '+(r.sex==='m'?'남':'여')+'</b> '+(Number(r.year)||0)+'년생 · '+(Number(r.age)||0)+'세에 '+(ENDS[r.end]?ENDS[r.end].n:'')+'</div>').join(''):''}).catch(e=>console.warn(e))};
  }catch(e){console.warn('firebase',e)}
  return o})();
</script>
